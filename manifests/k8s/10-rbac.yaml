---
# The identity a fork-sandbox client runs as: enough to submit a Job, fetch
# its result over kubectl exec, and clean up, and nothing more. It holds no
# secret of its own -- the provider key lives in a Secret this ServiceAccount
# cannot read, since submit, fetch and rm never need to. A CI pipeline can
# bind a kubeconfig to this ServiceAccount's token exactly as a workstation
# operator binds their own kubectl context to it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fork-sandbox-client
  namespace: __NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fork-sandbox-client
  namespace: __NAMESPACE__
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fork-sandbox-client
  namespace: __NAMESPACE__
subjects:
  - kind: ServiceAccount
    name: fork-sandbox-client
    namespace: __NAMESPACE__
roleRef:
  kind: Role
  name: fork-sandbox-client
  apiGroup: rbac.authorization.k8s.io
